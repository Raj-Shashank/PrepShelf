<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      PrepShelf | Study material for government exams and career prep
    </title>
    <meta
      id="meta-desc"
      name="description"
      content="Notes, e-books and previous year papers for SSC, Banking, Railway, UPSC and more, plus career prep tracks like Data Analyst."
    />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E45D6'/%3E%3Cpath d='M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3V8Z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --white: #fff;
        --paper: #f6f7f9;
        --ink: #16233b;
        --muted: #5a667a;
        --line: #e4e8ee;
        --blue: #1e45d6;
        --blue-dark: #1533a8;
        --blue-tint: #eef2fe;
        --amber: #f2a20c;
        --amber-dark: #de9000;
        --amber-tint: #fff4dc;
        --green: #11794f;
        --green-tint: #e6f5ee;
        --red: #c2372b;
        --font-head:
          "Plus Jakarta Sans", "Noto Sans Devanagari", system-ui, sans-serif;
        --font-body: "Inter", "Noto Sans Devanagari", system-ui, sans-serif;
        --r-lg: 20px;
        --shadow-pop: 0 18px 40px -20px rgba(22, 35, 59, 0.35);
        --wrap: 1180px;
        --gutter: 20px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink);
        background: #fff;
        -webkit-font-smoothing: antialiased;
      }
      img,
      svg {
        max-width: 100%;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--font-head);
        line-height: 1.18;
        letter-spacing: -0.015em;
        margin: 0;
        font-weight: 700;
      }
      p {
        margin: 0;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      :focus-visible {
        outline: 3px solid #8fa6f5;
        outline-offset: 2px;
        border-radius: 4px;
      }
      .skip {
        position: absolute;
        left: -999px;
        top: 8px;
        background: var(--ink);
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        z-index: 200;
      }
      .skip:focus {
        left: 8px;
      }
      .ic {
        flex: none;
        display: inline-block;
        vertical-align: -3px;
      }
      .wrap {
        width: 100%;
        max-width: var(--wrap);
        margin: 0 auto;
        padding: 0 var(--gutter);
      }
      .section {
        padding: 64px 0;
      }
      .section--tight {
        padding: 40px 0;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }
      .section-head h2 {
        font-size: clamp(1.5rem, 3vw, 2.1rem);
      }
      .section-head p {
        color: var(--muted);
        margin-top: 6px;
        max-width: 56ch;
      }
      .link-arrow {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: var(--blue);
        white-space: nowrap;
      }
      .link-arrow:hover {
        text-decoration: underline;
      }
      .lead {
        font-size: 1.125rem;
        color: var(--muted);
        max-width: 54ch;
      }
      .muted {
        color: var(--muted);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        border-radius: 10px;
        border: 1.5px solid transparent;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        background: none;
        text-decoration: none;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--blue-dark);
      }
      .btn-accent {
        background: var(--amber);
        color: #3a2600;
      }
      .btn-accent:hover {
        background: var(--amber-dark);
      }
      .btn-dark {
        background: var(--ink);
        color: #fff;
      }
      .btn-ghost {
        background: #fff;
        border-color: var(--line);
      }
      .btn-ghost:hover {
        border-color: var(--ink);
      }
      .btn-block {
        width: 100%;
      }
      .btn-sm {
        padding: 7px 13px;
        font-size: 0.88rem;
        border-radius: 8px;
      }
      .btn-lg {
        padding: 15px 26px;
        font-size: 1.02rem;
        border-radius: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--blue);
      }
      .chip.is-active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 600;
        background: var(--paper);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge--green {
        background: var(--green-tint);
        color: var(--green);
      }
      .badge--amber {
        background: var(--amber-tint);
        color: #8a5a00;
      }
      .badge--blue {
        background: var(--blue-tint);
        color: var(--blue);
      }
      .input,
      .select {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .input:focus,
      .select:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blue-tint);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 12px 0;
        pointer-events: none;
      }
      .glass {
        background: rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(18px) saturate(1.7);
        backdrop-filter: blur(18px) saturate(1.7);
        border: 1px solid rgba(255, 255, 255, 0.75);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          0 12px 32px -20px rgba(22, 35, 59, 0.4);
      }
      .nav {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 56px;
        padding: 0 8px 0 18px;
        border-radius: 999px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: var(--font-head);
        font-weight: 600;
        font-size: 1.08rem;
        letter-spacing: -0.01em;
      }
      .logo-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .nav-links {
        display: flex;
        gap: 2px;
        margin-left: 10px;
      }
      .nav-links a,
      .nav-link-btn {
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 300;
        font-size: 0.92rem;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .nav-links a:hover,
      .nav-link-btn:hover {
        background: rgba(22, 35, 59, 0.06);
      }
      .nav-links a.is-current {
        font-weight: 500;
        background: rgba(22, 35, 59, 0.07);
      }
      .nav-auth {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav-user {
        font-weight: 300;
        font-size: 0.9rem;
        padding: 0 8px;
      }
      .nav-auth .btn {
        padding: 8px 16px;
        font-weight: 400;
        font-size: 0.9rem;
        border-radius: 999px;
      }
      .menu-btn {
        display: none;
        margin-left: auto;
        background: none;
        border: 0;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        place-items: center;
        cursor: pointer;
      }
      .drawer {
        display: none;
        pointer-events: auto;
        margin-top: 8px;
        border-radius: 22px;
        padding: 6px 18px 18px;
      }
      .drawer.is-open {
        display: block;
      }
      .drawer > a {
        display: block;
        padding: 13px 2px;
        font-weight: 300;
        font-size: 1.02rem;
        border-bottom: 1px solid rgba(22, 35, 59, 0.08);
      }
      .drawer-auth {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .drawer-auth > * {
        flex: 1;
      }
      .is-home .site-header {
        margin-bottom: -80px;
      }
      .hero {
        position: relative;
        overflow: hidden;
        padding: 136px 0 72px;
        border-bottom: 1px solid var(--line);
        background:
          radial-gradient(
            55% 90% at 88% 30%,
            var(--blue-tint) 0%,
            rgba(238, 242, 254, 0) 70%
          ),
          #fff;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 48px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
        line-height: 1.15;
        margin-bottom: 18px;
        max-width: 20ch;
      }
      .hero-cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }
      .hero-popular {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .hero-popular > span {
        font-size: 0.9rem;
        color: var(--muted);
        margin-right: 4px;
      }
      .hero-visual {
        position: relative;
        height: 420px;
        max-width: 520px;
        width: 100%;
        justify-self: center;
      }
      .hero-book {
        position: absolute;
        width: 200px;
        display: block;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow-pop);
      }
      .hb-top {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 16px 30px;
        background: var(--tint);
        color: var(--tone);
      }
      .hb-top b {
        font-family: var(--font-head);
        font-size: 2rem;
        font-weight: 800;
        line-height: 1;
      }
      .hb-top small {
        font-weight: 600;
        font-size: 0.82rem;
      }
      .hb-bottom {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px 16px;
      }
      .hb-title {
        font-weight: 600;
        line-height: 1.3;
        font-size: 0.95rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .hb-price {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 1.15rem;
      }
      .hb-0 {
        left: 0;
        top: 96px;
        transform: rotate(-4deg);
      }
      .hb-1 {
        left: 162px;
        top: 6px;
        z-index: 2;
        transform: rotate(1deg);
      }
      .hb-2 {
        left: 322px;
        top: 118px;
        transform: rotate(5deg);
      }
      .hero-chip {
        position: absolute;
        left: 24px;
        bottom: 4px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 16px;
        box-shadow: var(--shadow-pop);
        max-width: 300px;
      }
      .hero-chip .ico {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--amber-tint);
        color: #8a5a00;
        display: grid;
        place-items: center;
        flex: none;
      }
      .hero-chip b {
        display: block;
        font-size: 0.92rem;
        line-height: 1.25;
      }
      .hero-chip small {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .benefits {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
        padding-top: 32px;
        padding-bottom: 32px;
      }
      .benefit {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .benefit .ico {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: var(--blue-tint);
        color: var(--blue);
        display: grid;
        place-items: center;
        flex: none;
      }
      .benefit b {
        display: block;
        margin-bottom: 2px;
      }
      .benefit span {
        color: var(--muted);
        font-size: 0.93rem;
      }
      .group-row {
        margin-bottom: 22px;
      }
      .exam-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .exam-tile {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        text-align: left;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        font: inherit;
      }
      .exam-tile:hover {
        border-color: var(--tone);
        box-shadow: 0 14px 28px -20px var(--tone);
      }
      .ex-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .exam-tile .mark {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--tint);
        color: var(--tone);
        display: grid;
        place-items: center;
        font-family: var(--font-head);
        font-weight: 700;
        font-size: 0.9rem;
      }
      .ex-arrow {
        color: var(--muted);
      }
      .ex-text b {
        display: block;
        font-family: var(--font-head);
        font-weight: 600;
        font-size: 1.08rem;
      }
      .ex-text small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.4;
      }
      .exam-tile .badge {
        margin-top: auto;
        align-self: flex-start;
      }
      .exam-tile.is-soon {
        background: var(--paper);
        border-style: dashed;
      }
      .m-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 22px;
      }
      .m-card {
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
      }
      .m-card:hover {
        border-color: #c9d2e3;
        box-shadow: var(--shadow-pop);
      }
      .cover {
        position: relative;
        min-height: 150px;
        padding: 18px 18px 16px 30px;
        background: var(--tint);
        color: var(--tone);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .cover::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--tone);
        opacity: 0.22;
      }
      .cover-exam {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 2rem;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .cover-type {
        font-size: 0.82rem;
        font-weight: 700;
      }
      .cover--lg {
        min-height: 280px;
        border-radius: var(--r-lg);
        padding: 28px 28px 26px 44px;
      }
      .cover--lg::before {
        left: 22px;
      }
      .cover--lg .cover-exam {
        font-size: 3.6rem;
      }
      .cover--lg .cover-title {
        font-family: var(--font-head);
        font-weight: 700;
        font-size: 1.3rem;
        line-height: 1.2;
        max-width: 22ch;
      }
      .m-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        flex: 1;
      }
      .m-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .m-title {
        font-family: var(--font-head);
        font-weight: 700;
        font-size: 1.08rem;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .m-foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .price {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 1.3rem;
      }
      .price--free {
        color: var(--green);
      }
      .mrp {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .bundle {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 32px;
        align-items: center;
        background: var(--blue);
        color: #fff;
        border-radius: var(--r-lg);
        padding: 44px;
      }
      .bundle h2 {
        font-size: clamp(1.6rem, 3.4vw, 2.4rem);
        margin-bottom: 16px;
      }
      .bundle li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 8px;
        color: #dce4ff;
      }
      .bundle li .ic {
        color: var(--amber);
        margin-top: 3px;
      }
      .bundle-buy {
        background: #fff;
        color: var(--ink);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
      }
      .bundle-buy .price {
        font-size: 2.2rem;
        display: block;
      }
      .vision {
        background: var(--paper);
        border-block: 1px solid var(--line);
      }
      .vision-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 56px;
        align-items: start;
      }
      .vision h2 {
        font-size: clamp(1.7rem, 3.6vw, 2.6rem);
        font-weight: 600;
        margin-bottom: 16px;
        max-width: 17ch;
      }
      .pillars {
        display: grid;
        gap: 20px;
        margin-top: 32px;
      }
      .roadmap {
        display: flex;
        flex-direction: column;
        gap: 14px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .road {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px 24px;
      }
      .road h3 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 10px 0 6px;
      }
      .road p {
        color: var(--muted);
        font-size: 0.94rem;
      }
      .road.is-live {
        border-color: var(--blue);
      }
      .road.is-later {
        background: transparent;
        border-style: dashed;
      }
      .lead-box {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        align-items: center;
        background: var(--amber-tint);
        border-radius: var(--r-lg);
        padding: 36px;
      }
      .lead-box h2 {
        font-size: clamp(1.4rem, 3vw, 1.9rem);
        margin-bottom: 8px;
      }
      .lead-form {
        display: flex;
        gap: 8px;
      }
      .lead-form .input {
        background: #fff;
        border-color: #f0dba8;
      }
      .faq {
        max-width: 780px;
      }
      .faq details {
        border-bottom: 1px solid var(--line);
        padding: 18px 0;
      }
      .faq summary {
        cursor: pointer;
        font-weight: 700;
        list-style: none;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
      }
      .faq summary::-webkit-details-marker {
        display: none;
      }
      .faq summary::after {
        content: "+";
        font-size: 1.4rem;
        color: var(--blue);
        line-height: 1;
      }
      .faq details[open] summary::after {
        content: "\2212";
      }
      .faq p {
        margin-top: 10px;
        color: var(--muted);
      }
      .ad {
        margin: 28px 0;
        min-height: 0;
        text-align: center;
      }
      .ad--placeholder {
        border: 1.5px dashed var(--line);
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 0.85rem;
        background: var(--paper);
        min-height: 90px;
      }
      .page-head {
        padding: 44px 0 28px;
        border-bottom: 1px solid var(--line);
      }
      .page-head h1 {
        font-size: clamp(1.9rem, 4vw, 2.8rem);
        margin-bottom: 10px;
      }
      .page-body {
        padding-top: 28px;
        padding-bottom: 72px;
      }
      .filters {
        display: grid;
        grid-template-columns: 2fr repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }
      .result-count {
        color: var(--muted);
        margin: 6px 0 16px;
        font-size: 0.93rem;
      }
      .empty {
        text-align: center;
        padding: 56px 20px;
        border: 1.5px dashed var(--line);
        border-radius: 14px;
        color: var(--muted);
      }
      .empty h3 {
        color: var(--ink);
        margin-bottom: 6px;
      }
      .detail {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 44px;
        align-items: start;
      }
      .detail h1 {
        font-size: clamp(1.7rem, 3.6vw, 2.5rem);
        margin: 26px 0 14px;
      }
      .buy-card {
        position: sticky;
        top: 92px;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 24px;
        background: #fff;
        box-shadow: var(--shadow-pop);
      }
      .buy-card .price {
        font-size: 2rem;
      }
      .buy-card .btn {
        margin-top: 18px;
      }
      .check-list li {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .check-list .ic {
        color: var(--green);
        margin-top: 3px;
      }
      .prose p {
        margin-top: 14px;
        color: #34415a;
      }
      .prose h2 {
        font-size: 1.3rem;
        margin-top: 32px;
      }
      .crumbs {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .crumbs a:hover {
        color: var(--blue);
      }
      .login {
        max-width: 400px;
        margin: 56px auto;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-pop);
        background: #fff;
      }
      .login h1 {
        font-size: 1.6rem;
        margin-bottom: 6px;
      }
      .login .field {
        margin: 18px 0 0;
      }
      .login .btn {
        margin-top: 20px;
      }
      .site-footer {
        background: var(--paper);
        border-top: 1px solid var(--line);
        padding: 56px 0 28px;
      }
      .foot-grid {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr 1fr;
        gap: 36px;
      }
      .foot-grid h4 {
        font-size: 0.95rem;
        margin-bottom: 12px;
      }
      .foot-grid li {
        margin-top: 8px;
      }
      .foot-grid a {
        color: var(--muted);
      }
      .foot-grid a:hover {
        color: var(--blue);
      }
      .foot-note {
        margin-top: 36px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .powered {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 5px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 300;
        color: var(--muted) !important;
      }
      .powered b {
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--ink);
      }
      .powered i {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        display: grid;
        place-items: center;
        font: 600 0.7rem var(--font-head);
        font-style: normal;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        background: var(--ink);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        z-index: 300;
        max-width: 90vw;
        font-weight: 500;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .callout {
        background: var(--amber-tint);
        border: 1px solid #f0dba8;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 0.92rem;
      }
      @media (max-width: 1024px) {
        .hero-grid {
          grid-template-columns: 1fr;
          gap: 36px;
        }
        .hero-visual {
          height: auto;
          max-width: none;
          display: flex;
          gap: 14px;
          overflow-x: auto;
          padding: 6px 2px 18px;
        }
        .hero-book {
          position: static;
          flex: 0 0 220px;
          transform: none;
        }
        .hero-chip {
          display: none;
        }
        .detail {
          grid-template-columns: 1fr;
        }
        .buy-card {
          position: static;
        }
        .filters {
          grid-template-columns: 1fr 1fr;
        }
        .filters > :first-child {
          grid-column: 1/-1;
        }
        .foot-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 900px) {
        .nav-links,
        .nav-auth {
          display: none;
        }
        .menu-btn {
          display: grid;
        }
        .bundle,
        .lead-box,
        .vision-grid {
          grid-template-columns: 1fr;
        }
        .bundle {
          padding: 28px;
        }
        .benefits {
          grid-template-columns: 1fr;
          gap: 20px;
        }
      }
      @media (max-width: 640px) {
        :root {
          --gutter: 16px;
        }
        .section {
          padding: 44px 0;
        }
        .site-header {
          padding: 10px 0;
        }
        .nav {
          height: 52px;
          padding: 0 6px 0 14px;
        }
        .is-home .site-header {
          margin-bottom: -72px;
        }
        .hero {
          padding: 108px 0 40px;
        }
        .hero-cta .btn {
          flex: 1 1 100%;
        }
        .lead-form {
          flex-direction: column;
        }
        .foot-grid {
          grid-template-columns: 1fr;
        }
        .section-head {
          flex-direction: column;
          align-items: flex-start;
        }
        .group-row {
          flex-wrap: nowrap;
          overflow-x: auto;
          margin-inline: calc(var(--gutter) * -1);
          padding-inline: var(--gutter);
        }
        .exam-grid {
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }
        .exam-tile {
          padding: 16px;
          gap: 12px;
        }
      }
      @media (max-width: 380px) {
        .exam-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main" data-action="skip">Skip to content</a>
    <header class="site-header" id="header"></header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer" id="footer"></footer>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        "use strict";

        const MATERIAL_TYPES = [
          "E-book",
          "Notes PDF",
          "Previous Year Papers",
          "Mock Test",
          "Syllabus & Strategy",
        ];
        const GOV_GROUP = "Government exams";

        const DEFAULT_SETTINGS = {
          siteName: "PrepShelf",
          tagline: "Study material for government exams and career prep.",
          whatsapp: "",
          telegram: "",
          email: "",
          parent: { name: "", url: "" },
          bundle: {
            enabled: true,
            title: "All-Exam Pass",
            price: 999,
            mrp: 2499,
            url: "",
            points: "",
            buttonLabel: "Get the pass",
            subtitle: "every exam, one payment",
          },
          ads: {
            enabled: false,
            clientId: "",
            placeholders: false,
            slots: {
              "home-mid": "",
              "list-top": "",
              "detail-side": "",
              "detail-bottom": "",
            },
          },
          home: {
            tracksTitle: "Choose your path",
            tracksText: "",
            featuredTitle: "Popular study material",
            featuredText: "",
            leadTitle: "Hear first when new material goes live",
            leadText: "",
            faqTitle: "Questions students ask",
            faq: [],
            show: {
              tracks: true,
              featured: true,
              bundle: true,
              lead: true,
              faq: true,
            },
          },
          materialsPage: { title: "Study material", text: "" },
        };

        const $ = (s, r) => (r || document).querySelector(s);
        const $$ = (s, r) =>
          Array.prototype.slice.call((r || document).querySelectorAll(s));
        const clone = (o) => JSON.parse(JSON.stringify(o));
        const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
        function deepMerge(base, patch) {
          Object.keys(patch || {}).forEach((k) => {
            base[k] =
              isObj(patch[k]) && isObj(base[k])
                ? deepMerge(base[k], patch[k])
                : clone(patch[k]);
          });
          return base;
        }
        const esc = (s) =>
          String(s == null ? "" : s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const safeUrl = (u) =>
          /^(https?:\/\/|mailto:|tel:)/i.test(String(u || "").trim())
            ? String(u).trim()
            : "";
        const fmtINR = (n) => "\u20B9" + Number(n || 0).toLocaleString("en-IN");
        const discount = (m) =>
          m.mrp > m.price && m.price > 0
            ? Math.round((1 - m.price / m.mrp) * 100)
            : 0;
        const tint = (h) => `--tint:hsl(${h} 65% 94%);--tone:hsl(${h} 55% 28%)`;
        const byId = (list) => Object.fromEntries(list.map((x) => [x.id, x]));

        function isVisible(m) {
          const now = Date.now();
          if (m.status === "draft") return false;
          if (m.publishAt && new Date(m.publishAt).getTime() > now)
            return false;
          if (m.expiresAt && new Date(m.expiresAt).getTime() < now)
            return false;
          return true;
        }

        const ICONS = {
          menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
          close: '<path d="M6 6l12 12M18 6 6 18"/>',
          download: '<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
          arrow: '<path d="M5 12h14m0 0-6-6m6 6-6 6"/>',
          check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
          book: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
          file: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
          gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2 0-4-.5-4-2.2S9.6 4 12 8Zm0 0c2 0 4-.5 4-2.2S14.4 4 12 8Z"/>',
          cap: '<path d="m12 4 10 5-10 5L2 9l10-5Z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>',
        };
        const icon = (n, size = 18) =>
          `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ""}</svg>`;

        let toastTimer;
        function toast(msg) {
          const t = $("#toast");
          if (!t) return;
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
        }
        function setMeta(title, desc) {
          document.title = title;
          if (desc) $("#meta-desc").setAttribute("content", desc);
        }

        let settings = clone(DEFAULT_SETTINGS);
        let user = null;
        let page = {};

        async function loadSettings() {
          try {
            const r = await fetch("/api/settings");
            if (!r.ok) throw 0;
            const s = await r.json();
            settings = deepMerge(clone(DEFAULT_SETTINGS), s || {});
          } catch (e) {
            settings = clone(DEFAULT_SETTINGS);
          }
        }
        async function loadExams() {
          try {
            const r = await fetch("/api/exams");
            if (!r.ok) throw 0;
            return await r.json();
          } catch (e) {
            return [];
          }
        }
        async function loadMaterials() {
          try {
            const r = await fetch("/api/materials");
            if (!r.ok) throw 0;
            const all = await r.json();
            return all.filter(isVisible);
          } catch (e) {
            return [];
          }
        }

        const userAuth = {
          enabled: false,
          async session() {
            return null;
          },
          async signUp() {
            throw new Error("Accounts are not live yet");
          },
          async signIn() {
            throw new Error("Accounts are not live yet");
          },
          async signOut() {},
        };

        const Logo = () =>
          `<a class="logo" href="#/" aria-label="${esc(settings.siteName)} home"><span class="logo-mark">${icon("book", 16)}</span>${esc(settings.siteName)}</a>`;
        const NAV = [
          { href: "#/", label: "Home", match: (p) => p === "/" },
          {
            href: "#/materials",
            label: "Study material",
            match: (p) => p.startsWith("/material"),
          },
          {
            href: "#/vision",
            label: "Our vision",
            match: (p) => p === "/vision",
          },
        ];
        function Header(path = "/") {
          const links = NAV.map(
            (n) =>
              `<a href="${n.href}" class="${n.match(path) ? "is-current" : ""}">${n.label}</a>`,
          ).join("");
          const bar = user
            ? `<span class="nav-user">${esc(user.name || user.email || "Account")}</span><button class="nav-link-btn" data-action="signOut">Sign out</button>`
            : `<a class="nav-link-btn" href="#/login">Log in</a><a class="btn btn-dark" href="#/signup">Sign up</a>`;
          const drawer = user
            ? `<button class="btn btn-ghost" data-action="signOut">Sign out</button>`
            : `<a class="btn btn-ghost" href="#/login">Log in</a><a class="btn btn-dark" href="#/signup">Sign up</a>`;
          return `<div class="wrap"><div class="nav glass">${Logo()}
      <nav class="nav-links" aria-label="Main">${links}</nav>
      <div class="nav-auth">${bar}</div>
      <button class="menu-btn" data-action="toggleNav" aria-label="Open menu">${icon("menu", 22)}</button></div>
      <div class="drawer glass" id="drawer">${links}<div class="drawer-auth">${drawer}</div></div></div>`;
        }
        const examGroup = (e) => e.group || GOV_GROUP;
        function examHref(e) {
          const l = String(e.link || "").trim();
          return l.startsWith("#/") || safeUrl(l)
            ? l
            : "#/materials?exam=" + e.id;
        }
        function Footer(exams) {
          const s = settings,
            p = s.parent || {};
          const contact = [
            s.whatsapp
              ? `<li><a href="https://wa.me/${esc(s.whatsapp)}" target="_blank">WhatsApp</a></li>`
              : "",
            safeUrl(s.telegram)
              ? `<li><a href="${esc(s.telegram)}" target="_blank">Telegram</a></li>`
              : "",
            s.email
              ? `<li><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></li>`
              : "",
          ].join("");
          const tag = `<i>${esc((p.name || "T")[0])}</i>Powered by <b>${esc(p.name || "")}</b>`;
          const powered = !p.name
            ? ""
            : safeUrl(p.url)
              ? `<a class="powered" href="${esc(p.url)}" target="_blank">${tag}</a>`
              : `<span class="powered">${tag}</span>`;
          const tracks = exams.filter((e) => e.status !== "soon").slice(0, 6);
          return `<div class="wrap"><div class="foot-grid">
      <div>${Logo()}<p class="muted" style="margin-top:12px;max-width:34ch">${esc(s.tagline)}</p><div style="margin-top:18px">${powered}</div></div>
      <div><h4>Tracks</h4><ul>${tracks.map((e) => `<li><a href="${esc(examHref(e))}">${esc(e.name)}</a></li>`).join("")}</ul></div>
      <div><h4>Explore</h4><ul><li><a href="#/materials">Study material</a></li><li><a href="#/vision">Our vision</a></li><li><a href="#/login">Log in</a></li></ul></div>
      <div><h4>Contact</h4><ul>${contact || '<li class="muted">Add contact details in Admin</li>'}</ul></div></div>
      <div class="foot-note"><span>&copy; ${new Date().getFullYear()} ${esc(s.siteName)}${p.name ? `, a product of ${esc(p.name)}` : ""}.</span></div></div>`;
        }

        const adSlot = (name) =>
          `<div class="ad" data-ad="${esc(name)}"></div>`;
        function priceBlock(m) {
          if (!(m.price > 0))
            return `<span class="price price--free">Free</span>`;
          const d = discount(m);
          return `<span class="price">${fmtINR(m.price)}</span>${d ? `<s class="mrp">${fmtINR(m.mrp)}</s><span class="badge badge--green">${d}% off</span>` : ""}`;
        }
        function MaterialCard(m, examsById) {
          const e = examsById[m.exam];
          return `<a class="m-card" href="#/material/${esc(m.id)}">
      <div class="cover" style="${tint(e ? e.hue : 220)}">${
        m.thumbnailUrl
          ? `<img src="${esc(m.thumbnailUrl)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9">`
          : ""
      }<span class="cover-exam" style="position:relative;z-index:1">${esc(e ? e.short : "PDF")}</span><span class="cover-type" style="position:relative;z-index:1">${esc(m.type)}</span></div>
      <div class="m-body"><div class="m-meta"><span class="badge">${esc(m.language)}</span>${m.pages ? `<span class="badge">${m.pages} pages</span>` : ""}</div>
        <h3 class="m-title">${esc(m.title)}</h3><div class="m-foot">${priceBlock(m)}</div></div></a>`;
        }
        function ExamTile(e, counts) {
          const soon = e.status === "soon",
            n = counts.materials[e.id] || 0;
          const inner = `<span class="ex-top"><span class="mark">${esc(e.short)}</span>${soon ? "" : `<span class="ex-arrow">${icon("arrow", 18)}</span>`}</span>
      <span class="ex-text"><b>${esc(e.name)}</b>${e.blurb ? `<small>${esc(e.blurb)}</small>` : ""}</span>
      <span class="badge ${soon ? "badge--amber" : "badge--blue"}">${soon ? "Coming soon" : n + " material" + (n === 1 ? "" : "s")}</span>`;
          if (soon)
            return `<button class="exam-tile is-soon" style="${tint(e.hue)}" data-action="examSoon" data-name="${esc(e.name)}">${inner}</button>`;
          const href = examHref(e),
            ext = /^https?:/i.test(href);
          return `<a class="exam-tile" href="${esc(href)}" style="${tint(e.hue)}"${ext ? ' target="_blank"' : ""}>${inner}</a>`;
        }
        function ExamExplorer() {
          const { exams, counts, group } = page;
          const groups = [...new Set(exams.map(examGroup))];
          const shown = exams
            .filter((e) => !group || examGroup(e) === group)
            .sort(
              (a, b) =>
                groups.indexOf(examGroup(a)) - groups.indexOf(examGroup(b)) ||
                (a.status === "soon") - (b.status === "soon"),
            );
          return `<div class="chip-row group-row" role="tablist">
      <button class="chip ${!group ? "is-active" : ""}" data-action="examGroup" data-group="">All</button>
      ${groups.map((g) => `<button class="chip ${group === g ? "is-active" : ""}" data-action="examGroup" data-group="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <div class="exam-grid">${shown.map((e) => ExamTile(e, counts)).join("")}</div>`;
        }
        function VisionSection() {
          const v = {
            headline: "One shelf for every exam and every career.",
            text: "PrepShelf starts with clear, affordable study material for government exams. We are growing into career tracks such as data analysis and software, so anyone preparing for a better future can find the right material in one place.",
            pillars: [
              [
                "book",
                "Clear over crowded",
                "Short, structured notes. Every pack says what is inside before you decide.",
              ],
              [
                "gift",
                "Free to start",
                "Each track has free packs, so you can try the material before you pay.",
              ],
              [
                "cap",
                "From exams to careers",
                "Government exams today. Data analyst, developer and more career tracks next.",
              ],
            ],
            roadmap: [
              [
                "Now",
                "Study material",
                "Notes, e-books and previous year papers for government exams and data analysis.",
                "live",
              ],
              [
                "Next",
                "More career tracks",
                "Software developer, digital marketing, finance, cloud and data science.",
                "next",
              ],
              [
                "Later",
                "Practice and progress",
                "Mock tests, a saved library and learner accounts.",
                "later",
              ],
            ],
          };
          const tone = { live: "badge--green", next: "badge--blue", later: "" };
          return `<section class="section vision"><div class="wrap vision-grid">
      <div><h2>${esc(v.headline)}</h2><p class="lead">${esc(v.text)}</p>
        <div class="pillars">${v.pillars.map(([ic, t, d]) => `<div class="benefit"><span class="ico">${icon(ic, 20)}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join("")}</div></div>
      <ol class="roadmap">${v.roadmap.map(([w, t, d, st]) => `<li class="road is-${st}"><span class="badge ${tone[st]}">${esc(w)}</span><h3>${esc(t)}</h3><p>${esc(d)}</p></li>`).join("")}</ol></div></section>`;
        }
        const EmptyState = (title, text, href, cta) =>
          `<div class="empty"><h3>${esc(title)}</h3><p>${esc(text)}</p>${href ? `<a class="btn btn-ghost" href="${href}">${esc(cta)}</a>` : ""}</div>`;
        const SectionHead = (title, sub, href, cta) =>
          `<div class="section-head"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div>${href ? `<a class="link-arrow" href="${href}">${esc(cta)} ${icon("arrow", 16)}</a>` : ""}</div>`;
        const LeadBox = () => {
          const H = settings.home || {};
          return `<div class="lead-box"><div><h2>${esc(H.leadTitle || "Hear first when new material goes live")}</h2>
      <p class="muted">${esc(H.leadText || "")}</p></div>
      <form data-form="lead" class="lead-form"><input class="input" name="contact" required placeholder="Email or WhatsApp number">
        <button class="btn btn-primary" type="submit">Notify me</button></form></div>`;
        };

        /* ============================================================
     BUY / DOWNLOAD — routes both paid AND free items to /pay.html
  ============================================================ */
        function materialAction(m) {
          const wa = settings.whatsapp
            ? `https://wa.me/${settings.whatsapp}?text=${encodeURIComponent("Hi, I want to get: " + m.title)}`
            : "";
          if (m.price > 0) {
            const ext = safeUrl(m.buyUrl);
            if (ext)
              return {
                href: ext,
                label: `Buy for ${fmtINR(m.price)}`,
                cls: "btn-accent",
              };
            return {
              href: "/pay.html?id=" + encodeURIComponent(m.id),
              label: `Buy for ${fmtINR(m.price)}`,
              cls: "btn-accent",
            };
          }
          /* Free — still go through checkout to collect lead */
          return {
            href: "/pay.html?id=" + encodeURIComponent(m.id),
            label: "Download free PDF",
            cls: "btn-primary",
          };
        }
        function ActionButton(m) {
          const a = materialAction(m),
            ic = icon(m.price > 0 ? "arrow" : "download");
          if (!a.href)
            return `<button class="btn ${a.cls} btn-block" data-action="noLink">${ic} ${a.label}</button>`;
          const isExternal = /^https?:/i.test(a.href);
          return `<a class="btn ${a.cls} btn-block" href="${esc(a.href)}"${isExternal ? ' target="_blank" rel="noopener"' : ""}>${ic} ${a.label}</a>`;
        }

        const materialCounts = (ms) => {
          const c = {};
          ms.forEach((m) => {
            c[m.exam] = (c[m.exam] || 0) + 1;
          });
          return c;
        };

        async function viewHome() {
          const [materials, exams] = await Promise.all([
            loadMaterials(),
            loadExams(),
          ]);
          setMeta(
            `${settings.siteName} | Study material for government exams and career prep`,
          );
          const featured = (
            materials.filter((m) => m.featured).length
              ? materials.filter((m) => m.featured)
              : materials
          ).slice(0, 6);
          const counts = { materials: materialCounts(materials) };
          const live = exams.filter((e) => e.status !== "soon");
          const soon = exams.length - live.length;
          page = { scope: "home", exams, counts, group: "" };
          const examsById = byId(exams);
          const b = settings.bundle || {};
          const H = settings.home || {};
          const show = H.show || {};
          const bundleAction =
            safeUrl(b.url) ||
            (settings.whatsapp
              ? `https://wa.me/${settings.whatsapp}?text=${encodeURIComponent("Hi, I want the " + b.title)}`
              : "");
          const faqList = (H.faq || [])
            .map(
              (x) =>
                `<details><summary>${esc(x.q || "")}</summary><p>${esc(x.a || "")}</p></details>`,
            )
            .join("");

          return `
      <section class="hero"><div class="wrap hero-grid">
        <div><h1>Study material for your exam and your next career</h1>
          <p class="lead">Notes, e-books and previous year papers for government exams, with career tracks like Data Analyst on the way. All in one place.</p>
          <div class="hero-cta"><a class="btn btn-primary btn-lg" href="#/materials">Browse study material</a><a class="btn btn-ghost btn-lg" href="#/vision">Our vision</a></div>
          <div class="hero-popular"><span>Jump to your exam:</span>${live
            .slice(0, 5)
            .map(
              (e) =>
                `<a class="chip" href="${esc(examHref(e))}">${esc(e.name)}</a>`,
            )
            .join("")}</div></div>
        <div class="hero-visual">
          ${featured
            .slice(0, 3)
            .map((m, i) => {
              const e = examsById[m.exam];
              return `<a class="hero-book hb-${i}" href="#/material/${esc(m.id)}" style="${tint(e ? e.hue : 220)}">
              <span class="hb-top"><b>${esc(e ? e.short : "PDF")}</b><small>${esc(m.type)}</small></span>
              <span class="hb-bottom"><span class="hb-title">${esc(m.title)}</span><span class="hb-price">${m.price > 0 ? fmtINR(m.price) : "Free"}</span></span></a>`;
            })
            .join("")}
          <a class="hero-chip" href="#/vision"><span class="ico">${icon("cap", 20)}</span><span><b>${live.length} tracks live</b><small>${soon ? soon + " more coming soon" : "More on the way"}</small></span></a>
        </div></div></section>
      <div class="wrap benefits">
        <div class="benefit"><span class="ico">${icon("file", 20)}</span><div><b>Opens on any phone</b><span>Light PDFs that need no special app.</span></div></div>
        <div class="benefit"><span class="ico">${icon("cap", 20)}</span><div><b>Exams and careers</b><span>Government exams today, career skills next.</span></div></div>
        <div class="benefit"><span class="ico">${icon("gift", 20)}</span><div><b>Free packs to start</b><span>Try free notes, then upgrade when you need more.</span></div></div></div>
      ${
        show.tracks !== false
          ? `<section class="section" style="padding-top:24px"><div class="wrap">
        ${SectionHead(H.tracksTitle || "Choose your path", H.tracksText || "")}
        <div id="exam-explorer">${ExamExplorer()}</div></div></section>`
          : ""
      }
      ${
        show.featured !== false
          ? `<section class="section" style="padding-top:8px"><div class="wrap">
        ${SectionHead(H.featuredTitle || "Popular study material", H.featuredText || "", "#/materials", "View all material")}
        <div class="m-grid">${featured.map((m) => MaterialCard(m, examsById)).join("")}</div>${adSlot("home-mid")}</div></section>`
          : ""
      }
      ${
        b.enabled !== false && show.bundle !== false
          ? `<section class="section--tight"><div class="wrap"><div class="bundle">
        <div><h2>${esc(b.title || "All-Exam Pass")}: ${esc(b.subtitle || "every exam, one payment")}</h2>
          <ul>${String(b.points || "")
            .split("\n")
            .filter(Boolean)
            .map((p) => `<li>${icon("check", 18)}<span>${esc(p)}</span></li>`)
            .join("")}</ul></div>
        <div class="bundle-buy"><span class="price">${fmtINR(b.price)}</span>${b.mrp > b.price ? `<s class="mrp">${fmtINR(b.mrp)}</s>` : ""}
          ${bundleAction ? `<a class="btn btn-accent btn-block" style="margin-top:16px" href="${esc(bundleAction)}" target="_blank">${esc(b.buttonLabel || "Get the pass")}</a>` : `<button class="btn btn-accent btn-block" style="margin-top:16px" data-action="noLink">${esc(b.buttonLabel || "Get the pass")}</button>`}</div></div></div></section>`
          : ""
      }
      ${show.vision !== false ? VisionSection() : ""}
      ${show.lead !== false ? `<section class="section--tight"><div class="wrap">${LeadBox()}</div></section>` : ""}
      ${show.faq !== false && faqList ? `<section class="section"><div class="wrap">${SectionHead(H.faqTitle || "Questions students ask")}<div class="faq">${faqList}</div></div></section>` : ""}`;
        }

        function filterMaterials(list, q) {
          const words = (q.q || "").toLowerCase().split(/\s+/).filter(Boolean);
          const r = list.filter((m) => {
            if (q.exam && m.exam !== q.exam) return false;
            if (q.type && m.type !== q.type) return false;
            if (q.price === "free" && m.price > 0) return false;
            if (q.price === "paid" && !(m.price > 0)) return false;
            const hay =
              `${m.title} ${m.description || ""} ${m.type}`.toLowerCase();
            return words.every((w) => hay.includes(w));
          });
          const sorters = {
            featured: (a, b) =>
              (b.featured ? 1 : 0) - (a.featured ? 1 : 0) ||
              String(b.createdAt || "").localeCompare(
                String(a.createdAt || ""),
              ),
            newest: (a, b) =>
              String(b.createdAt || "").localeCompare(
                String(a.createdAt || ""),
              ),
            low: (a, b) => a.price - b.price,
            high: (a, b) => b.price - a.price,
          };
          return r.sort(sorters[q.sort] || sorters.featured);
        }
        function materialResultsHtml() {
          const rows = filterMaterials(page.materials, page.mq);
          if (!rows.length)
            return EmptyState(
              "No material found",
              "Try a different exam or clear the filters.",
              "#/materials",
              "Clear filters",
            );
          return `<p class="result-count">${rows.length} result${rows.length === 1 ? "" : "s"}</p><div class="m-grid">${rows.map((m) => MaterialCard(m, page.examsById)).join("")}</div>`;
        }
        async function viewMaterials(query) {
          const [materials, exams] = await Promise.all([
            loadMaterials(),
            loadExams(),
          ]);
          page = {
            scope: "materials",
            materials,
            exams,
            examsById: byId(exams),
            mq: { ...query },
          };
          const exam = page.examsById[query.exam];
          const q = page.mq;
          setMeta(
            `${exam ? exam.name + " " : ""}Study material | ${settings.siteName}`,
          );
          const opt = (v, l, cur) =>
            `<option value="${esc(v)}"${String(cur || "") === String(v) ? " selected" : ""}>${esc(l)}</option>`;
          return `<section class="page-head"><div class="wrap"><h1>${exam ? esc(exam.name) + " study material" : "Study material"}</h1>
        <p class="lead">E-books, notes, previous year papers and mock tests.</p></div></section>
      <section class="wrap page-body" data-scope="materials"><div class="filters">
        <input class="input" data-filter="q" value="${esc(q.q || "")}" placeholder="Search material">
        <select class="select" data-filter="exam">${opt("", "All exams", q.exam)}${exams
          .filter((e) => e.status !== "soon")
          .map((e) => opt(e.id, e.name, q.exam))
          .join("")}</select>
        <select class="select" data-filter="type">${opt("", "All types", q.type)}${MATERIAL_TYPES.map((t) => opt(t, t, q.type)).join("")}</select>
        <select class="select" data-filter="price">${opt("", "Free and paid", q.price)}${opt("free", "Free only", q.price)}${opt("paid", "Paid only", q.price)}</select>
        <select class="select" data-filter="sort">${opt("featured", "Featured first", q.sort)}${opt("newest", "Newest", q.sort)}${opt("low", "Price: low to high", q.sort)}${opt("high", "Price: high to low", q.sort)}</select></div>
        ${adSlot("list-top")}<div id="results">${materialResultsHtml()}</div></section>`;
        }
        async function viewMaterial(id) {
          const [exams, all] = await Promise.all([
            loadExams(),
            loadMaterials(),
          ]);
          const m = all.filter((x) => x.id === id)[0];
          if (!m) return viewNotFound();
          const exam = byId(exams)[m.exam];
          setMeta(`${m.title} | ${settings.siteName}`, m.description);
          const related = all
            .filter((x) => x.exam === m.exam && x.id !== m.id)
            .slice(0, 3);
          const includes = String(m.includes || "")
            .split(/\r?\n/)
            .filter(Boolean);
          return `<section class="page-body wrap" style="padding-top:36px">
      <p class="crumbs"><a href="#/materials">Study material</a>${exam ? ` / <a href="#/materials?exam=${esc(exam.id)}">${esc(exam.name)}</a>` : ""}</p>
      <div class="detail"><div>
        <div class="cover cover--lg" style="${tint(exam ? exam.hue : 220)}">${
          m.thumbnailUrl
            ? `<img src="${esc(m.thumbnailUrl)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85">`
            : ""
        }<span class="cover-exam" style="position:relative;z-index:1">${esc(exam ? exam.short : "PDF")}</span><span class="cover-title" style="position:relative;z-index:1">${esc(m.title)}</span></div>
        <h1>${esc(m.title)}</h1>
        <div class="m-meta"><span class="badge badge--blue">${esc(m.type)}</span><span class="badge">${esc(m.language)}</span>${m.pages ? `<span class="badge">${m.pages} pages</span>` : ""}</div>
        <div class="prose"><p>${esc(m.description)}</p>${includes.length ? `<h2>What is inside</h2><ul class="check-list">${includes.map((i) => `<li>${icon("check", 18)}<span>${esc(i)}</span></li>`).join("")}</ul>` : ""}</div>
        ${adSlot("detail-bottom")}</div>
        <aside><div class="buy-card"><div class="m-foot">${priceBlock(m)}</div>${ActionButton(m)}
          <p class="muted" style="margin-top:14px;font-size:.88rem">PDF format. Opens on phone, tablet and computer.</p></div>${adSlot("detail-side")}</aside></div>
      ${related.length ? `<div style="margin-top:56px">${SectionHead("More for " + (exam ? exam.name : "this track"))}<div class="m-grid">${related.map((x) => MaterialCard(x, byId(exams))).join("")}</div></div>` : ""}</section>`;
        }
        async function viewVision() {
          setMeta(`Our vision | ${settings.siteName}`);
          return `<section class="page-head"><div class="wrap"><h1>Where PrepShelf is going</h1><p class="lead">What we are building today and what comes next.</p></div></section>
      ${VisionSection()}<section class="section--tight"><div class="wrap">${LeadBox()}</div></section>`;
        }
        function viewAuth(mode) {
          const up = mode === "signup";
          setMeta((up ? "Sign up" : "Log in") + ` | ${settings.siteName}`);
          return `<section class="wrap"><form class="login" data-form="auth" data-mode="${mode}">
      <h1>${up ? "Create your account" : "Welcome back"}</h1>
      <div class="callout" style="margin-top:16px">Accounts are coming soon.</div>
      ${up ? '<div class="field"><label for="au-name">Name</label><input class="input" id="au-name" name="name" required></div>' : ""}
      <div class="field"><label for="au-email">Email</label><input class="input" id="au-email" type="email" name="email" required></div>
      <div class="field"><label for="au-pw">Password</label><input class="input" id="au-pw" type="password" name="password" required></div>
      <button class="btn btn-primary btn-block" type="submit">${up ? "Create account" : "Log in"}</button></form></section>`;
        }
        function viewNotFound() {
          setMeta(`Page not found | ${settings.siteName}`);
          return `<section class="wrap page-body" style="padding-top:64px">${EmptyState("This page does not exist", "The link may be old or the item may have been removed.", "#/", "Go to home page")}</section>`;
        }

        function hydrateAds() {
          const a = settings.ads;
          $$(".ad[data-ad]").forEach((el) => {
            const slotId = a.slots && a.slots[el.dataset.ad];
            if (a.enabled && a.clientId && slotId) {
              if (!$("script[data-adsense]")) {
                const s = document.createElement("script");
                s.async = true;
                s.dataset.adsense = "1";
                s.src =
                  "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" +
                  encodeURIComponent(a.clientId);
                document.head.appendChild(s);
              }
              el.innerHTML = `<ins class="adsbygoogle" style="display:block" data-ad-client="${esc(a.clientId)}" data-ad-slot="${esc(slotId)}" data-ad-format="auto"></ins>`;
              try {
                (window.adsbygoogle = window.adsbygoogle || []).push({});
              } catch (e) {}
            } else if (a.placeholders) {
              el.classList.add("ad--placeholder");
              el.textContent = "Ad space: " + el.dataset.ad;
            } else el.remove();
          });
        }

        const ROUTES = [
          [/^\/$/, () => viewHome()],
          [/^\/materials$/, (m, q) => viewMaterials(q)],
          [/^\/material\/([\w-]+)$/, (m) => viewMaterial(m[1])],
          [/^\/vision$/, () => viewVision()],
          [/^\/(login|signup)$/, (m) => viewAuth(m[1])],
        ];
        function parseHash() {
          const [path, qs = ""] = (location.hash.slice(1) || "/").split("?");
          return { path, query: Object.fromEntries(new URLSearchParams(qs)) };
        }
        let routeToken = 0;
        async function renderRoute() {
          const token = ++routeToken;
          const { path, query } = parseHash();
          document.body.classList.toggle("is-home", path === "/");
          const exams = await loadExams();
          let html = viewNotFound();
          for (const [re, view] of ROUTES) {
            const m = path.match(re);
            if (m) {
              html = await view(m, query);
              break;
            }
          }
          if (token !== routeToken) return;
          $("#header").innerHTML = Header(path);
          $("#footer").innerHTML = Footer(exams);
          $("#main").innerHTML = html;
          hydrateAds();
          window.scrollTo(0, 0);
        }
        function refreshResults() {
          const t = $("#results");
          if (!t || page.scope !== "materials") return;
          t.innerHTML = materialResultsHtml();
          const qs = new URLSearchParams(
            Object.entries(page.mq).filter(([, v]) => v),
          ).toString();
          history.replaceState(null, "", "#/materials" + (qs ? "?" + qs : ""));
        }

        const actions = {
          skip(el, e) {
            e.preventDefault();
            $("#main").focus();
          },
          toggleNav(el) {
            const d = $("#drawer"),
              open = d.classList.toggle("is-open");
            el.setAttribute("aria-expanded", open);
            $("svg", el).outerHTML = icon(open ? "close" : "menu", 22);
          },
          noLink() {
            toast("No link added yet. Add one in Admin.");
          },
          examGroup(el) {
            if (page.scope !== "home") return;
            page.group = el.dataset.group;
            $("#exam-explorer").innerHTML = ExamExplorer();
          },
          examSoon(el) {
            toast(el.dataset.name + " is coming soon.");
          },
          async signOut() {
            user = null;
            renderRoute();
          },
        };
        document.addEventListener("click", (e) => {
          const el = e.target.closest("[data-action]");
          if (el && actions[el.dataset.action])
            actions[el.dataset.action](el, e);
        });
        ["input", "change"].forEach((evt) =>
          document.addEventListener(evt, (e) => {
            const el = e.target.closest("[data-filter]");
            if (
              el &&
              (evt === "change" || el.tagName === "INPUT") &&
              page.scope === "materials"
            ) {
              page.mq[el.dataset.filter] = el.value;
              refreshResults();
            }
          }),
        );
        const forms = {
          async lead(form) {
            const contact = form.elements.contact.value.trim();
            try {
              await fetch("/api/leads", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ contact }),
              });
              form.reset();
              toast("Done. You are on the list.");
            } catch (e) {
              toast("Could not save right now.");
            }
          },
          async auth(form) {
            toast("Accounts are coming soon");
          },
        };
        document.addEventListener("submit", (e) => {
          const f = e.target.closest("form[data-form]");
          if (f && forms[f.dataset.form]) {
            e.preventDefault();
            forms[f.dataset.form](f);
          }
        });
        window.addEventListener("hashchange", renderRoute);

        (async function init() {
          await loadSettings();
          user = await userAuth.session();
          await renderRoute();
        })();
      })();
    </script>
  </body>
</html>
