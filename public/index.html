<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      PrepShelf | Study material for government exams and career prep
    </title>
    <meta
      id="meta-desc"
      name="description"
      content="Notes, e-books and previous year papers for SSC, Banking, Railway, UPSC and more, plus career prep tracks like Data Analyst."
    />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E45D6'/%3E%3Cpath d='M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3V8Z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root {
        --white: #fff;
        --paper: #f6f7f9;
        --ink: #16233b;
        --muted: #5a667a;
        --line: #e4e8ee;
        --blue: #1e45d6;
        --blue-dark: #1533a8;
        --blue-tint: #eef2fe;
        --amber: #f2a20c;
        --amber-dark: #de9000;
        --amber-tint: #fff4dc;
        --green: #11794f;
        --green-tint: #e6f5ee;
        --red: #c2372b;
        --font-head:
          "Plus Jakarta Sans", "Noto Sans Devanagari", system-ui, sans-serif;
        --font-body: "Inter", "Noto Sans Devanagari", system-ui, sans-serif;
        --r-lg: 20px;
        --shadow-pop: 0 18px 40px -20px rgba(22, 35, 59, 0.35);
        --wrap: 1180px;
        --gutter: 20px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink);
        background: #fff;
        -webkit-font-smoothing: antialiased;
      }
      img,
      svg {
        max-width: 100%;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--font-head);
        line-height: 1.18;
        letter-spacing: -0.015em;
        margin: 0;
        font-weight: 700;
      }
      p {
        margin: 0;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      :focus-visible {
        outline: 3px solid #8fa6f5;
        outline-offset: 2px;
        border-radius: 4px;
      }
      .skip {
        position: absolute;
        left: -999px;
        top: 8px;
        background: var(--ink);
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        z-index: 200;
      }
      .skip:focus {
        left: 8px;
      }
      .ic {
        flex: none;
        display: inline-block;
        vertical-align: -3px;
      }
      .wrap {
        width: 100%;
        max-width: var(--wrap);
        margin: 0 auto;
        padding: 0 var(--gutter);
      }
      .section {
        padding: 64px 0;
      }
      .section--tight {
        padding: 40px 0;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }
      .section-head h2 {
        font-size: clamp(1.5rem, 3vw, 2.1rem);
      }
      .section-head p {
        color: var(--muted);
        margin-top: 6px;
        max-width: 56ch;
      }
      .link-arrow {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: var(--blue);
        white-space: nowrap;
      }
      .link-arrow:hover {
        text-decoration: underline;
      }
      .lead {
        font-size: 1.125rem;
        color: var(--muted);
        max-width: 54ch;
      }
      .muted {
        color: var(--muted);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        border-radius: 10px;
        border: 1.5px solid transparent;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        background: none;
        text-decoration: none;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--blue-dark);
      }
      .btn-accent {
        background: var(--amber);
        color: #3a2600;
      }
      .btn-accent:hover {
        background: var(--amber-dark);
      }
      .btn-dark {
        background: var(--ink);
        color: #fff;
      }
      .btn-ghost {
        background: #fff;
        border-color: var(--line);
      }
      .btn-ghost:hover {
        border-color: var(--ink);
      }
      .btn-block {
        width: 100%;
      }
      .btn-sm {
        padding: 7px 13px;
        font-size: 0.88rem;
        border-radius: 8px;
      }
      .btn-lg {
        padding: 15px 26px;
        font-size: 1.02rem;
        border-radius: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--blue);
      }
      .chip.is-active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 600;
        background: var(--paper);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge--green {
        background: var(--green-tint);
        color: var(--green);
      }
      .badge--amber {
        background: var(--amber-tint);
        color: #8a5a00;
      }
      .badge--blue {
        background: var(--blue-tint);
        color: var(--blue);
      }
      .input,
      .select {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .input:focus,
      .select:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blue-tint);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* ============================================================
         NAVBAR — frosted glass pill + profile dropdown
      ============================================================ */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 12px 0;
        pointer-events: none;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        -webkit-backdrop-filter: blur(24px) saturate(1.8);
        backdrop-filter: blur(24px) saturate(1.8);
        border: 1px solid rgba(255, 255, 255, 0.82);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -1px 0 rgba(22, 35, 59, 0.04),
          0 20px 50px -28px rgba(22, 35, 59, 0.5);
      }
      .nav {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 64px;
        padding: 0 10px 0 20px;
        border-radius: 999px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-head);
        font-weight: 600;
        font-size: 1.08rem;
        letter-spacing: -0.01em;
        flex: none;
      }
      .logo-mark {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: var(--blue);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 6px 14px -6px rgba(30, 69, 214, 0.55);
      }
      .nav-links {
        flex: 1;
        display: flex;
        justify-content: center;
        gap: 4px;
        margin: 0;
      }
      .nav-links a,
      .nav-link-btn {
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 400;
        font-size: 0.92rem;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--ink);
        transition:
          background 0.18s ease,
          color 0.18s ease;
      }
      .nav-links a:hover,
      .nav-link-btn:hover {
        background: rgba(22, 35, 59, 0.06);
      }
      .nav-links a.is-current {
        font-weight: 600;
        background: rgba(22, 35, 59, 0.08);
      }
      .nav-auth {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .nav-auth .btn {
        padding: 9px 20px;
        font-weight: 500;
        font-size: 0.9rem;
        border-radius: 999px;
        box-shadow: 0 8px 18px -12px rgba(22, 35, 59, 0.45);
        transition:
          background 0.18s ease,
          transform 0.15s ease,
          box-shadow 0.18s ease;
      }
      .nav-auth .btn-dark:hover {
        background: #1e2b47;
        transform: translateY(-1px);
        box-shadow: 0 12px 22px -14px rgba(22, 35, 59, 0.6);
      }
      .nav-auth .nav-link-btn {
        padding: 9px 14px;
        font-weight: 500;
      }

      /* ---- profile dropdown ---- */
      .profile-menu {
        position: relative;
      }
      .profile-trigger {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 4px 14px 4px 4px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        font-family: inherit;
        color: var(--ink);
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .profile-trigger:hover {
        border-color: #c9d2e3;
        box-shadow: 0 6px 16px -12px rgba(22, 35, 59, 0.3);
      }
      .profile-trigger[aria-expanded="true"] {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--blue-tint);
      }
      .profile-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--blue), #3b6bf0);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.88rem;
        flex: none;
        letter-spacing: 0;
      }
      .profile-name {
        font-weight: 500;
        font-size: 0.9rem;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .profile-chevron {
        color: var(--muted);
        display: inline-flex;
        transition: transform 0.2s ease;
      }
      .profile-trigger[aria-expanded="true"] .profile-chevron {
        transform: rotate(180deg);
      }
      .profile-dropdown {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        min-width: 240px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 20px 40px -20px rgba(22, 35, 59, 0.4);
        padding: 6px;
        display: none;
        z-index: 100;
      }
      .profile-dropdown.is-open {
        display: block;
      }
      .profile-dropdown-head {
        padding: 10px 12px 12px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 6px;
      }
      .profile-dropdown-name {
        font-weight: 600;
        font-size: 0.94rem;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .profile-dropdown-email {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .profile-dropdown a,
      .profile-dropdown button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 9px;
        font-size: 0.9rem;
        background: none;
        border: 0;
        cursor: pointer;
        font-family: inherit;
        color: var(--ink);
        font-weight: 500;
        transition: background 0.14s ease;
      }
      .profile-dropdown a:hover,
      .profile-dropdown button:hover {
        background: var(--paper);
      }
      .profile-dropdown a .ic,
      .profile-dropdown button .ic {
        color: var(--muted);
        flex: none;
      }
      .profile-dropdown button.signout {
        color: var(--red);
      }
      .profile-dropdown button.signout .ic {
        color: var(--red);
      }

      .menu-btn {
        display: none;
        margin-left: auto;
        background: none;
        border: 0;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        place-items: center;
        cursor: pointer;
        transition: background 0.18s ease;
      }
      .menu-btn:hover {
        background: rgba(22, 35, 59, 0.06);
      }
      .drawer {
        display: none;
        pointer-events: auto;
        margin-top: 10px;
        border-radius: 22px;
        padding: 8px 18px 18px;
      }
      .drawer.is-open {
        display: block;
      }
      .drawer > a {
        display: block;
        padding: 13px 2px;
        font-weight: 400;
        font-size: 1.02rem;
        border-bottom: 1px solid rgba(22, 35, 59, 0.06);
        transition: color 0.15s ease;
      }
      .drawer > a:hover {
        color: var(--blue);
      }
      .drawer-auth {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .drawer-auth > * {
        flex: 1;
      }

      .is-home .site-header {
        margin-bottom: -80px;
      }
      .hero {
        position: relative;
        overflow: hidden;
        padding: 136px 0 72px;
        border-bottom: 1px solid var(--line);
        background:
          radial-gradient(
            55% 90% at 88% 30%,
            var(--blue-tint) 0%,
            rgba(238, 242, 254, 0) 70%
          ),
          #fff;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 48px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
        line-height: 1.15;
        margin-bottom: 18px;
        max-width: 20ch;
      }
      .hero-cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }
      .hero-popular {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .hero-popular > span {
        font-size: 0.9rem;
        color: var(--muted);
        margin-right: 4px;
      }
      .hero-visual {
        position: relative;
        height: 420px;
        max-width: 520px;
        width: 100%;
        justify-self: center;
      }
      .hero-book {
        position: absolute;
        width: 200px;
        display: block;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow-pop);
      }
      .hb-top {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 16px 30px;
        background: var(--tint);
        color: var(--tone);
      }
      .hb-top b {
        font-family: var(--font-head);
        font-size: 2rem;
        font-weight: 800;
        line-height: 1;
      }
      .hb-top small {
        font-weight: 600;
        font-size: 0.82rem;
      }
      .hb-bottom {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px 16px;
      }
      .hb-title {
        font-weight: 600;
        line-height: 1.3;
        font-size: 0.95rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .hb-price {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 1.15rem;
      }
      .hb-0 {
        left: 0;
        top: 96px;
        transform: rotate(-4deg);
      }
      .hb-1 {
        left: 162px;
        top: 6px;
        z-index: 2;
        transform: rotate(1deg);
      }
      .hb-2 {
        left: 322px;
        top: 118px;
        transform: rotate(5deg);
      }
      .hero-chip {
        position: absolute;
        left: 24px;
        bottom: 4px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 16px;
        box-shadow: var(--shadow-pop);
        max-width: 300px;
      }
      .hero-chip .ico {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--amber-tint);
        color: #8a5a00;
        display: grid;
        place-items: center;
        flex: none;
      }
      .hero-chip b {
        display: block;
        font-size: 0.92rem;
        line-height: 1.25;
      }
      .hero-chip small {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .benefits {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
        padding-top: 32px;
        padding-bottom: 32px;
      }
      .benefit {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .benefit .ico {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: var(--blue-tint);
        color: var(--blue);
        display: grid;
        place-items: center;
        flex: none;
      }
      .benefit b {
        display: block;
        margin-bottom: 2px;
      }
      .benefit span {
        color: var(--muted);
        font-size: 0.93rem;
      }
      .group-row {
        margin-bottom: 22px;
      }
      .exam-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .exam-tile {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        text-align: left;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        font: inherit;
      }
      .exam-tile:hover {
        border-color: var(--tone);
        box-shadow: 0 14px 28px -20px var(--tone);
      }
      .ex-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .exam-tile .mark {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--tint);
        color: var(--tone);
        display: grid;
        place-items: center;
        font-family: var(--font-head);
        font-weight: 700;
        font-size: 0.9rem;
      }
      .ex-arrow {
        color: var(--muted);
      }
      .ex-text b {
        display: block;
        font-family: var(--font-head);
        font-weight: 600;
        font-size: 1.08rem;
      }
      .ex-text small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.4;
      }
      .exam-tile .badge {
        margin-top: auto;
        align-self: flex-start;
      }
      .exam-tile.is-soon {
        background: var(--paper);
        border-style: dashed;
      }
      .m-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 22px;
      }
      .m-card {
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
      }
      .m-card:hover {
        border-color: #c9d2e3;
        box-shadow: var(--shadow-pop);
      }
      .cover {
        position: relative;
        min-height: 150px;
        padding: 18px 18px 16px 30px;
        background: var(--tint);
        color: var(--tone);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .cover::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--tone);
        opacity: 0.22;
      }
      .cover-exam {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 2rem;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .cover-type {
        font-size: 0.82rem;
        font-weight: 700;
      }
      .cover--lg {
        min-height: 280px;
        border-radius: var(--r-lg);
        padding: 28px 28px 26px 44px;
      }
      .cover--lg::before {
        left: 22px;
      }
      .cover--lg .cover-exam {
        font-size: 3.6rem;
      }
      .cover--lg .cover-title {
        font-family: var(--font-head);
        font-weight: 700;
        font-size: 1.3rem;
        line-height: 1.2;
        max-width: 22ch;
      }
      .m-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;

              return "";
            }
          },
          _setToken(t) {
            try {
              if (t) localStorage.setItem(CUSTOMER_TOKEN_KEY, t);
              else localStorage.removeItem(CUSTOMER_TOKEN_KEY);
            } catch (e) {}
          },
          async session() {
            const t = this._getToken();
            if (!t) return null;
            try {
              const r = await fetch("/api/customer/me", {
                headers: { authorization: "Bearer " + t },
              });
              if (!r.ok) {
                this._setToken("");
                return null;
              }
              const data = await r.json();
              return data.user || null;
            } catch (e) {
              return null;
            }

            const data = await r.json().catch(() => ({}));

                method: "POST",

              });
            } catch (e) {}

        function loadGis() {
          if (window.google && window.google.accounts) return Promise.resolve();
          if (gisPromise) return gisPromise;
          gisPromise = new Promise(function (resolve, reject) {
            if (document.querySelector('script[src="' + GIS_SRC + '"]')) {
              let tries = 0;
              const t = setInterval(() => {
                tries++;
                if (window.google && window.google.accounts) {
                  clearInterval(t);
                  resolve();
                } else if (tries > 100) {
                  clearInterval(t);
                  reject(new Error("Google script not ready"));
                }
              }, 60);
              return;
            }
            const s = document.createElement("script");
            s.src = GIS_SRC;
            s.async = true;
            s.defer = true;
            s.onload = () => resolve();
            s.onerror = () => reject(new Error("Could not load Google"));
            document.head.appendChild(s);
          });
          return gisPromise;
        }

          const faqList = (H.faq || [])

              (x) =>
                `<details><summary>${esc(x.q || "")}</summary><p>${esc(x.a || "")}</p></details>`,
            )
            .join("");

          return `
      <section class="hero"><div class="wrap hero-grid">
        <div><h1>Study material for your exam and your next career</h1>
          <p class="lead">Notes, e-books and previous year papers for government exams, with career tracks like Data Analyst on the way. All in one place.</p>
          <div class="hero-cta"><a class="btn btn-primary btn-lg" href="#/materials">Browse study material</a><a class="btn btn-ghost btn-lg" href="/vision.html">Our vision</a></div>
          <div class="hero-popular"><span>Jump to your exam:</span>${live
            .slice(0, 5)
            .map(
              (e) =>
                `<a class="chip" href="${esc(examHref(e))}">${esc(e.name)}</a>`,
            )
            .join("")}</div></div>
        <div class="hero-visual">
          ${featured
            .slice(0, 3)
            .map((m, i) => {
              const e = examsById[m.exam];
              return `<a class="hero-book hb-${i}" href="#/material/${esc(m.id)}" style="${tint(e ? e.hue : 220)}">
              <span class="hb-top"><b>${esc(e ? e.short : "PDF")}</b><small>${esc(m.type)}</small></span>
              <span class="hb-bottom"><span class="hb-title">${esc(m.title)}</span><span class="hb-price">${m.price > 0 ? fmtINR(m.price) : "Free"}</span></span></a>`;
            })
            .join("")}
          <a class="hero-chip" href="/vision.html"><span class="ico">${icon("cap", 20)}</span><span><b>${live.length} tracks live</b><small>${soon ? soon + " more coming soon" : "More on the way"}</small></span></a>
        </div></div></section>
      <div class="wrap benefits">
        <div class="benefit"><span class="ico">${icon("file", 20)}</span><div><b>Opens on any phone</b><span>Light PDFs that need no special app.</span></div></div>
        <div class="benefit"><span class="ico">${icon("cap", 20)}</span><div><b>Exams and careers</b><span>Government exams today, career skills next.</span></div></div>
        <div class="benefit"><span class="ico">${icon("gift", 20)}</span><div><b>Free packs to start</b><span>Try free notes, then upgrade when you need more.</span></div></div></div>
      ${
        show.tracks !== false
          ? `<section class="section" style="padding-top:24px"><div class="wrap">
        ${SectionHead(H.tracksTitle || "Choose your path", H.tracksText || "")}
        <div id="exam-explorer">${ExamExplorer()}</div></div></section>`
          : ""
      }
      ${
        show.featured !== false
          ? `<section class="section" style="padding-top:8px"><div class="wrap">
        ${SectionHead(H.featuredTitle || "Popular study material", H.featuredText || "", "#/materials", "View all material")}
        <div class="m-grid">${featured.map((m) => MaterialCard(m, examsById)).join("")}</div>${adSlot("home-mid")}</div></section>`
          : ""
      }
      ${
        b.enabled !== false && show.bundle !== false
          ? `<section class="section--tight"><div class="wrap"><div class="bundle">
        <div><h2>${esc(b.title || "All-Exam Pass")}: ${esc(b.subtitle || "every exam, one payment")}</h2>
          <ul>${String(b.points || "")
            .split("\n")
            .filter(Boolean)
            .map((p) => `<li>${icon("check", 18)}<span>${esc(p)}</span></li>`)
            .join("")}</ul></div>
        <div class="bundle-buy"><span class="price">${fmtINR(b.price)}</span>${b.mrp > b.price ? `<s class="mrp">${fmtINR(b.mrp)}</s>` : ""}
          ${bundleAction ? `<a class="btn btn-accent btn-block" style="margin-top:16px" href="${esc(bundleAction)}" target="_blank">${esc(b.buttonLabel || "Get the pass")}</a>` : `<button class="btn btn-accent btn-block" style="margin-top:16px" data-action="noLink">${esc(b.buttonLabel || "Get the pass")}</button>`}</div></div></div></section>`
          : ""
      }
      ${show.vision !== false ? VisionSection() : ""}
      ${show.lead !== false ? `<section class="section--tight"><div class="wrap">${LeadBox()}</div></section>` : ""}
      ${show.faq !== false && faqList ? `<section class="section"><div class="wrap">${SectionHead(H.faqTitle || "Questions students ask")}<div class="faq">${faqList}</div></div></section>` : ""}`;
        }

        function filterMaterials(list, q) {
          const words = (q.q || "").toLowerCase().split(/\s+/).filter(Boolean);
          const r = list.filter((m) => {
            if (q.exam && m.exam !== q.exam) return false;
            if (q.type && m.type !== q.type) return false;
            if (q.price === "free" && m.price > 0) return false;
            if (q.price === "paid" && !(m.price > 0)) return false;
            const hay =
              `${m.title} ${m.description || ""} ${m.type}`.toLowerCase();
            return words.every((w) => hay.includes(w));
          });
          const sorters = {
            featured: (a, b) =>
              (b.featured ? 1 : 0) - (a.featured ? 1 : 0) ||
              String(b.createdAt || "").localeCompare(
                String(a.createdAt || ""),
              ),
            newest: (a, b) =>
              String(b.createdAt || "").localeCompare(
                String(a.createdAt || ""),
              ),
            low: (a, b) => a.price - b.price,
            high: (a, b) => b.price - a.price,
          };
          return r.sort(sorters[q.sort] || sorters.featured);
        }
        function materialResultsHtml() {
          const rows = filterMaterials(page.materials, page.mq);
          if (!rows.length)
            return EmptyState(
              "No material found",
              "Try a different exam or clear the filters.",
              "#/materials",
              "Clear filters",
            );
          return `<p class="result-count">${rows.length} result${rows.length === 1 ? "" : "s"}</p><div class="m-grid">${rows.map((m) => MaterialCard(m, page.examsById)).join("")}</div>`;
        }
        async function viewMaterials(query) {
          const [materials, exams] = await Promise.all([
            loadMaterials(),
            loadExams(),
          ]);
          page = {
            scope: "materials",
            materials,
            exams,
            examsById: byId(exams),
            mq: { ...query },
          };
          const exam = page.examsById[query.exam];
          const q = page.mq;
          setMeta(
            `${exam ? exam.name + " " : ""}Study material | ${settings.siteName}`,
          );
          const opt = (v, l, cur) =>
            `<option value="${esc(v)}"${String(cur || "") === String(v) ? " selected" : ""}>${esc(l)}</option>`;
          return `<section class="page-head"><div class="wrap"><h1>${exam ? esc(exam.name) + " study material" : "Study material"}</h1>
        <p class="lead">E-books, notes, previous year papers and mock tests.</p></div></section>
      <section class="wrap page-body" data-scope="materials"><div class="filters">
        <input class="input" data-filter="q" value="${esc(q.q || "")}" placeholder="Search material">
        <select class="select" data-filter="exam">${opt("", "All exams", q.exam)}${exams
          .filter((e) => e.status !== "soon")
          .map((e) => opt(e.id, e.name, q.exam))
          .join("")}</select>
        <select class="select" data-filter="type">${opt("", "All types", q.type)}${MATERIAL_TYPES.map((t) => opt(t, t, q.type)).join("")}</select>
        <select class="select" data-filter="price">${opt("", "Free and paid", q.price)}${opt("free", "Free only", q.price)}${opt("paid", "Paid only", q.price)}</select>
        <select class="select" data-filter="sort">${opt("featured", "Featured first", q.sort)}${opt("newest", "Newest", q.sort)}${opt("low", "Price: low to high", q.sort)}${opt("high", "Price: high to low", q.sort)}</select></div>
        ${adSlot("list-top")}<div id="results">${materialResultsHtml()}</div></section>`;
        }
        async function viewMaterial(id) {
          const [exams, all] = await Promise.all([
            loadExams(),
            loadMaterials(),
          ]);
          const m = all.filter((x) => x.id === id)[0];
          if (!m) return viewNotFound();
          const exam = byId(exams)[m.exam];
          setMeta(`${m.title} | ${settings.siteName}`, m.description);
          const related = all
            .filter((x) => x.exam === m.exam && x.id !== m.id)
            .slice(0, 3);
          const includes = String(m.includes || "")
            .split(/\r?\n/)
            .filter(Boolean);
          return `<section class="page-body wrap" style="padding-top:36px">
      <p class="crumbs"><a href="#/materials">Study material</a>${exam ? ` / <a href="#/materials?exam=${esc(exam.id)}">${esc(exam.name)}</a>` : ""}</p>
      <div class="detail"><div>
        <div class="cover cover--lg" style="${tint(exam ? exam.hue : 220)}">${
          m.thumbnailUrl
            ? `<img src="${esc(m.thumbnailUrl)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85">`
            : ""
        }<span class="cover-exam" style="position:relative;z-index:1">${esc(exam ? exam.short : "PDF")}</span><span class="cover-title" style="position:relative;z-index:1">${esc(m.title)}</span></div>
        <h1>${esc(m.title)}</h1>
        <div class="m-meta"><span class="badge badge--blue">${esc(m.type)}</span><span class="badge">${esc(m.language)}</span>${m.pages ? `<span class="badge">${m.pages} pages</span>` : ""}</div>
        <div class="prose"><p>${esc(m.description)}</p>${includes.length ? `<h2>What is inside</h2><ul class="check-list">${includes.map((i) => `<li>${icon("check", 18)}<span>${esc(i)}</span></li>`).join("")}</ul>` : ""}</div>
        ${adSlot("detail-bottom")}</div>
        <aside><div class="buy-card"><div class="m-foot">${priceBlock(m)}</div>${ActionButton(m)}
          <p class="muted" style="margin-top:14px;font-size:.88rem">PDF format. Opens on phone, tablet and computer.</p></div>${adSlot("detail-side")}</aside></div>
      ${related.length ? `<div style="margin-top:56px">${SectionHead("More for " + (exam ? exam.name : "this track"))}<div class="m-grid">${related.map((x) => MaterialCard(x, byId(exams))).join("")}</div></div>` : ""}</section>`;
        }

        /* ---------- Account (purchases + invoices) ---------- */
        async function viewAccount() {
          if (!user) {
            location.hash = "#/login";
            return "";
          }
          setMeta(`My account | ${settings.siteName}`);

          let orders = [];
          let error = "";
          try {
            orders = await customerApi("/orders");
          } catch (e) {
            error = e.message || "Could not load your purchases.";
          }

          const token = userAuth._getToken();

          const rows = orders.length
            ? orders
                .map((o) => {
                  const amount = Number(o.finalAmount) || 0;
                  const status =
                    o.status === "paid"
                      ? "Paid"
                      : o.status === "free"
                        ? "Free"
                        : o.status || "—";
                  const id = encodeURIComponent(o.id);
                  const tk = encodeURIComponent(token);
                  const actions = [
                    o.status === "paid" || o.status === "free"
                      ? `<a class="btn btn-ghost btn-sm" href="/api/customer/orders/${id}/invoice?token=${tk}" target="_blank" rel="noopener">Invoice</a>`
                      : "",
                    o.hasDownload
                      ? `<a class="btn btn-primary btn-sm" href="/api/customer/orders/${id}/download?token=${tk}">Download</a>`
                      : "",
                  ]
                    .filter(Boolean)
                    .join(" ");
                  return `<tr>
          <td style="padding:12px;border-bottom:1px solid var(--line)">
            <b>${esc(o.materialTitle || o.materialId || "—")}</b>
            <div class="muted" style="font-size:.8rem">${esc(o.orderId || o.id)}</div>
          </td>
          <td style="padding:12px;border-bottom:1px solid var(--line)">${esc(fmtDate(o.paidAt || o.createdAt))}</td>
          <td style="padding:12px;border-bottom:1px solid var(--line)">${amount > 0 ? fmtINR(amount) : "Free"}</td>
          <td style="padding:12px;border-bottom:1px solid var(--line)">${esc(status)}</td>
          <td style="padding:12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap">${actions || "—"}</td>
        </tr>`;
                })
                .join("")
            : `<tr><td colspan="5" style="padding:32px;text-align:center;color:var(--muted)">
         No purchases yet. <a href="#/materials" style="color:var(--blue);font-weight:600">Browse study material</a>.
       </td></tr>`;

          return `<section class="page-head"><div class="wrap">
      <h1>My account</h1>
      <p class="lead">${esc(user.name || "")}${user.email ? " · " + esc(user.email) : ""}</p>
    </div></section>
    <section class="wrap page-body">
      ${error ? `<div class="callout" style="margin-bottom:18px">${esc(error)}</div>` : ""}
      <div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;overflow:auto">
        <h2 style="margin-bottom:12px">Purchases &amp; downloads</h2>
        <table style="width:100%;border-collapse:collapse;min-width:620px">
          <thead><tr>
            <th style="text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:.8rem;text-transform:uppercase;color:var(--muted)">Product</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:.8rem;text-transform:uppercase;color:var(--muted)">Date</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:.8rem;text-transform:uppercase;color:var(--muted)">Amount</th>
            <th style="text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:.8rem;text-transform:uppercase;color:var(--muted)">Status</th>
            <th style="text-align:right;padding:10px;border-bottom:1px solid var(--line)"></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p style="margin-top:18px"><button class="btn btn-ghost" data-action="signOut">Sign out</button></p>
    </section>`;
        }

        function viewAuth(mode) {
          const up = mode === "signup";
          setMeta((up ? "Sign up" : "Log in") + ` | ${settings.siteName}`);
          return `<section class="wrap"><div class="login">
      <h1>${up ? "Create your account" : "Welcome back"}</h1>
      <p class="muted" style="margin-top:6px">${up ? "Save your downloads and picks in one place." : "Sign in to continue."}</p>
      <form data-form="auth" data-mode="${mode}" novalidate>
        ${up ? '<div class="field"><label for="au-name">Name</label><input class="input" id="au-name" name="name" autocomplete="name" required></div>' : ""}
        <div class="field"><label for="au-email">Email</label><input class="input" id="au-email" type="email" name="email" autocomplete="email" required></div>
        <div class="field"><label for="au-pw">Password</label><input class="input" id="au-pw" type="password" name="password" autocomplete="${up ? "new-password" : "current-password"}" required></div>
        <button class="btn btn-primary btn-block" type="submit">${up ? "Create account" : "Log in"}</button>
      </form>
      <div class="auth-divider">or</div>
      <div class="g-slot" id="g-slot"></div>
      <p class="login-alt">${up ? 'Already have an account? <a href="#/login">Log in</a>' : 'New here? <a href="#/signup">Create an account</a>'}</p>
    </div></section>`;
        }
        function viewNotFound() {
          setMeta(`Page not found | ${settings.siteName}`);
          return `<section class="wrap page-body" style="padding-top:64px">${EmptyState("This page does not exist", "The link may be old or the item may have been removed.", "#/", "Go to home page")}</section>`;
        }

        /* ============================================================
           ADS RENDERER (AdSense + image banners)
        ============================================================ */
        function normalizeAdSlot(v) {
          if (typeof v === "string") {
            return Object.assign({}, AD_SLOT_DEFAULTS, { slotId: v });
          }
          return Object.assign({}, AD_SLOT_DEFAULTS, v || {});
        }
        function ensureAdsense(clientId) {
          if (document.querySelector("script[data-adsense]")) return;
          const s = document.createElement("script");
          s.async = true;
          s.dataset.adsense = "1";
          s.src =
            "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" +
            encodeURIComponent(clientId);
          document.head.appendChild(s);
        }
        function hydrateAds() {
          const a = settings.ads || {};
          $$(".ad[data-ad]").forEach((el) => {
            const slot = normalizeAdSlot(a.slots && a.slots[el.dataset.ad]);
            el.classList.remove("ad--placeholder");
            el.innerHTML = "";

            if (slot.image) {
              const size =
                slot.width && slot.height
                  ? ` width="${esc(slot.width)}" height="${esc(slot.height)}"`
                  : "";
              const img = `<img src="${esc(slot.image)}" alt="${esc(slot.alt || "")}"${size} loading="lazy" decoding="async" style="max-width:100%;height:auto;display:block;margin:0 auto">`;
              const link = safeUrl(slot.link);
              el.innerHTML = link
                ? `<a href="${esc(link)}" target="_blank" rel="noopener sponsored">${img}</a>`
                : img;
              return;
            }

            if (a.enabled && a.clientId && slot.slotId) {
              ensureAdsense(a.clientId);
              el.innerHTML = `<ins class="adsbygoogle" style="display:block" data-ad-client="${esc(a.clientId)}" data-ad-slot="${esc(slot.slotId)}" data-ad-format="auto" data-full-width-responsive="true"></ins>`;
              try {
                (window.adsbygoogle = window.adsbygoogle || []).push({});
              } catch (e) {}
              return;
            }

            if (a.placeholders) {
              el.classList.add("ad--placeholder");
              el.textContent = "Ad space: " + el.dataset.ad;
              return;
            }
            el.remove();
          });
        }

        const ROUTES = [
          [/^\/$/, () => viewHome()],
          [/^\/materials$/, (m, q) => viewMaterials(q)],
          [/^\/material\/([\w-]+)$/, (m) => viewMaterial(m[1])],
          [/^\/account$/, () => viewAccount()],
          [/^\/(login|signup)$/, (m) => viewAuth(m[1])],
        ];
        function parseHash() {
          const [path, qs = ""] = (location.hash.slice(1) || "/").split("?");
          return { path, query: Object.fromEntries(new URLSearchParams(qs)) };
        }
        let routeToken = 0;
        async function renderRoute() {
          const token = ++routeToken;
          const { path, query } = parseHash();
          document.body.classList.toggle("is-home", path === "/");
          const exams = await loadExams();
          let html = viewNotFound();
          for (const [re, view] of ROUTES) {
            const m = path.match(re);
            if (m) {
              html = await view(m, query);
              break;
            }
          }
          if (token !== routeToken) return;
          $("#header").innerHTML = Header(path);
          $("#footer").innerHTML = Footer(exams);
          $("#main").innerHTML = html;
          hydrateAds();
          if (document.getElementById("g-slot")) mountGoogle();
          window.scrollTo(0, 0);
        }
        function refreshResults() {
          const t = $("#results");
          if (!t || page.scope !== "materials") return;
          t.innerHTML = materialResultsHtml();
          const qs = new URLSearchParams(
            Object.entries(page.mq).filter(([, v]) => v),
          ).toString();
          history.replaceState(null, "", "#/materials" + (qs ? "?" + qs : ""));
        }

        const actions = {
          skip(el, e) {
            e.preventDefault();
            $("#main").focus();
          },
          toggleNav(el) {
            const d = $("#drawer"),
              open = d.classList.toggle("is-open");
            el.setAttribute("aria-expanded", open);
            $("svg", el).outerHTML = icon(open ? "close" : "menu", 22);
          },
          toggleProfile(el) {
            const dd = document.getElementById("profile-dropdown");
            if (!dd) return;
            const open = dd.classList.toggle("is-open");
            el.setAttribute("aria-expanded", open ? "true" : "false");
          },
          noLink() {
            toast("No link added yet. Add one in Admin.");
          },
          examGroup(el) {
            if (page.scope !== "home") return;
            page.group = el.dataset.group;
            $("#exam-explorer").innerHTML = ExamExplorer();
          },
          examSoon(el) {
            toast(el.dataset.name + " is coming soon.");
          },
          async signOut() {
            await userAuth.signOut();
            user = null;
            toast("Signed out");
            if (location.hash === "#/" || location.hash === "") renderRoute();
            else location.hash = "#/";
          },
          "google-help"() {
            toast(
              "Google sign-in is not configured yet. Add a Client ID in Admin → Security.",
            );
          },
        };
        document.addEventListener("click", (e) => {
          const el = e.target.closest("[data-action]");
          if (el && actions[el.dataset.action]) {
            actions[el.dataset.action](el, e);
          }
          /* Close profile dropdown when clicking outside it */
          const menu = document.querySelector(".profile-menu");
          const dd = document.getElementById("profile-dropdown");
          if (dd && menu && !menu.contains(e.target)) {
            dd.classList.remove("is-open");
            const trigger = menu.querySelector(".profile-trigger");
            if (trigger) trigger.setAttribute("aria-expanded", "false");
          }
        });
        ["input", "change"].forEach((evt) =>
          document.addEventListener(evt, (e) => {
            const el = e.target.closest("[data-filter]");
            if (
              el &&
              (evt === "change" || el.tagName === "INPUT") &&
              page.scope === "materials"
            ) {
              page.mq[el.dataset.filter] = el.value;
              refreshResults();
            }
          }),
        );
        const forms = {
          async lead(form) {
            const contact = form.elements.contact.value.trim();
            try {
              await fetch("/api/leads", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ contact }),
              });
              form.reset();
              toast("Done. You are on the list.");
            } catch (e) {
              toast("Could not save right now.");
            }
          },
          async auth(form) {
            const mode = form.dataset.mode === "signup" ? "signup" : "login";
            const name =
              mode === "signup" ? (form.elements.name.value || "").trim() : "";
            const email = (form.elements.email.value || "")
              .trim()
              .toLowerCase();
            const password = form.elements.password.value || "";
            const btn = form.querySelector('button[type="submit"]');
            const orig = btn ? btn.textContent : "";

            if (mode === "signup" && name.length < 2)
              return toast("Please enter your name");
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
              return toast("Please enter a valid email");
            if (password.length < 6)
              return toast("Password must be at least 6 characters");

            if (btn) {
              btn.disabled = true;
              btn.textContent = "Please wait…";
            }
            try {
              const u =
                mode === "signup"
                  ? await userAuth.signUp(name, email, password)
                  : await userAuth.signIn(email, password);
              user = u;
              toast(mode === "signup" ? "Account created" : "Welcome back");
              if (location.hash === "#/" || location.hash === "") renderRoute();
              else location.hash = "#/";
            } catch (e) {
              toast(e.message || "Could not sign you in");
              if (btn) {
                btn.disabled = false;
                btn.textContent = orig;
              }
            }
          },
        };
        document.addEventListener("submit", (e) => {
          const f = e.target.closest("form[data-form]");
          if (f && forms[f.dataset.form]) {
            e.preventDefault();
            forms[f.dataset.form](f);
          }
        });
        window.addEventListener("hashchange", renderRoute);

        (async function init() {
          await loadSettings();
          user = await userAuth.session();
          await renderRoute();
        })();
      })();
    </script>
  </body>
</html>
